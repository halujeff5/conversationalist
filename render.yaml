services:
  - type: web
    name: conversationalist
    runtime: python
    buildCommand: uv sync --locked --no-install-project --no-dev
    startCommand: uv run --no-sync python bot.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
